<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Two overlapping user profiles">
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#1e293b"/>
  <!-- back profile -->
  <circle cx="82" cy="46" r="17" fill="#ef4444"/>
  <path d="M52 108c0-17 13-30 30-30s30 13 30 30z" fill="#ef4444"/>
  <!-- front profile, outlined so it separates from the back one -->
  <circle cx="50" cy="52" r="19" fill="#3b82f6" stroke="#1e293b" stroke-width="5"/>
  <path d="M16 112c0-19 15-34 34-34s34 15 34 34z" fill="#3b82f6" stroke="#1e293b" stroke-width="5" stroke-linejoin="round"/>
</svg>
